</style></head><body><main><header><div><div class="kicker">SELINA YANG · REVISION 03</div><h1>SY / 错位</h1><p>保留原标志的字母关系，重新绘制笔画与轮廓。</p></div><button id="theme" type="button" aria-pressed="false">看白底</button></header><section class="grid"><div class="mark-stage"><img src="iterations/v3/mark.svg" alt="无衬线、斜切端部、上下错位的 SY 标志"></div><div class="notes"><h2>去掉古典装饰，<br>让字母更有力度。</h2><p>移除椭圆与衬线，保留 S 在左上、Y 在右下的关系。<br>笔画加实、端部斜切，用银白色衔接黑色光学首屏。</p><div class="proof"><img class="symbol" src="iterations/v3/nav.svg" alt="白底独立标志"><img class="lockup" src="iterations/v3/lockup.svg" alt="标志与姓名组合"></div><div class="tiny"><span>32 / 24 / 16 PX</span><img src="iterations/v3/nav.svg" width="36" height="32" alt="32 像素"><img src="iterations/v3/nav.svg" width="28" height="24" alt="24 像素"><img src="iterations/v3/nav.svg" width="19" height="16" alt="16 像素"></div></div></section><section><div class="preview-head"><h2>放到网站左上角</h2><div class="choices"><button data-mode="symbol" aria-pressed="true">仅标志</button><button data-mode="name" aria-pressed="false">标志 + 姓名</button></div></div><div class="window"><div class="nav"><div class="brand"><img id="nav-logo" src="iterations/v3/nav.svg" alt="Selina Yang 首页标志"></div><div class="nav-links"><span>About</span><span>Work</span><span>Open source</span><span>EN / 中文</span></div></div><div class="hero"><div class="lens"></div><div class="hero-text"><strong>SELINA YANG</strong><span>AI PRODUCT DESIGNER</span></div></div></div><p class="caption">导航视觉样稿 · 可切换独立标志与姓名组合</p></section><footer><span>这是独立修改稿，等你确认后再替换网站标志。</span><a href="iterations/v3/comparison.png" target="_blank">查看完整对比图 ↗</a></footer></main><script>
