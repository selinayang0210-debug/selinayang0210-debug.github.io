/* Studio marks and a deliberate reading hierarchy. */
:root{--ink:#222735;--text-secondary:#465164;--muted:#626d7e;--studio-tertiary:#626d7e;--faint:#707b8b;--icon-blue:#4963c8;--icon-teal:#287a75;--icon-clay:#a45a42;--icon-ochre:#9a7127;--icon-violet:#7961b6;--icon-slate:#63718a}
.studio-icon{display:inline-block;width:20px;height:20px;flex:none;vertical-align:middle}.studio-icon .icon-tint{fill:currentColor;fill-opacity:.2}.studio-icon .icon-solid{fill:currentColor;stroke:none}.studio-icon-blue{color:var(--icon-blue)}.studio-icon-teal{color:var(--icon-teal)}.studio-icon-clay{color:var(--icon-clay)}.studio-icon-ochre{color:var(--icon-ochre)}.studio-icon-violet{color:var(--icon-violet)}.studio-icon-slate{color:var(--icon-slate)}
.nav-item{color:var(--text-secondary);font-weight:500}.nav-item>.studio-icon{width:20px;height:20px}.nav-item.active{font-weight:650}.project-mark,.project-emblem{background:#f7f0df}.project-mark .studio-icon{width:18px;height:18px}.project-emblem .studio-icon{width:23px;height:23px}.nav-label{color:#566174}.identity strong{color:var(--ink)}
.project-heading p,.stage-title-row p,.task-description p,.page-head p{color:var(--text-secondary)}.task-title,.team-person strong,.work-card strong,.section-title h2{color:var(--ink)}.team-person small{color:var(--muted)}.task-subline{color:var(--muted)}
.hifi-context .context-section h3{font-size:13px;line-height:1.45;font-weight:650;color:var(--ink);letter-spacing:-.1px}.context-fraction{color:var(--ink);font-variant-numeric:tabular-nums}.hifi-context .context-meta{font-size:11px;color:var(--muted)}.context-summary-link{font-size:12px;color:var(--text-secondary);gap:8px}.context-summary-link>.studio-icon{width:17px;height:17px}.context-summary-link:hover{color:var(--blue)}
.hifi-context .context-meeting>span>strong{font-size:13px;font-weight:650;color:var(--ink)}.hifi-context .context-meeting>span>small{font-size:11px;color:var(--muted)}.context-meeting .meeting-date{background:#fff8f3;border-color:#e9d7c9;color:var(--icon-clay);overflow:hidden}.hifi-context .meeting-date small{display:block;color:#985436;font-size:9px;font-weight:650;letter-spacing:.5px}.hifi-context .meeting-date strong{font-size:19px;color:#733f2c}.context-notes{font-size:12px;color:var(--blue);font-weight:550}

/* Icon and input share a single focus boundary. */
.search-field:focus-within{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:2px}
.search-field input:focus,.search-field input:focus-visible{outline:none;box-shadow:none}
.workspace-search-field{width:100%;height:44px;gap:10px;padding:0 12px}
.workspace-search-field input{flex:1;width:100%;height:100%;font-size:15px;padding:10px 0;border-radius:0}

/* Workspace search stays in the navigation rail. */
.sidebar-search{margin:0 0 22px;min-width:0}
.sidebar-search-entry{position:relative;display:flex;align-items:center;padding:3px}
.sidebar-search-field{flex:1;min-width:0;height:36px;gap:8px;cursor:text}
.sidebar-search-field input{flex:1;min-width:0;width:100%;cursor:text;border-radius:0}
.sidebar-search-field .kbd{display:flex;align-items:center;justify-content:center;flex:0 0 28px;height:24px;font-size:10px;padding:2px 4px;pointer-events:none}
.sidebar-search-field>.i{flex-shrink:0;pointer-events:none}
.sidebar-search-close{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:24px;color:var(--muted)}
.sidebar-search-close[hidden],.sidebar-search-panel[hidden],.side-navigation[hidden]{display:none}
.search-active .sidebar-search-field .kbd{visibility:hidden}
.sidebar-search-hint{margin:12px 8px;color:var(--muted);font-size:11px;line-height:1.6}
.sidebar-search-panel .record-row{display:flex;align-items:flex-start;gap:10px;width:100%;min-width:0;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:6px;text-align:left}
.sidebar-search-panel .record-row>.i,.sidebar-search-panel .record-row>img{width:17px;height:17px;flex-shrink:0;margin-top:2px}
.sidebar-search-panel .record-row>.i:last-child{display:none}
.sidebar-search-panel .record-row .grow{min-width:0}
.sidebar-search-panel .record-row strong{font-size:12px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sidebar-search-panel .record-row p{font-size:10px;line-height:1.6;margin-top:4px;color:var(--muted)}
.sidebar-search-panel .record-row:hover,.sidebar-search-panel .record-row:focus-visible{background:var(--blue-soft)}
.sidebar-search-panel .record-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.sidebar-search-panel .empty{padding:24px 8px;text-align:left}
.sidebar-search-panel .empty h3{font-size:14px}
@media(max-width:820px){.sidebar-search-field{height:42px}.sidebar-search-field input{font-size:16px}}

function sharedFile(person,pid=ui.project){
 if(!person)return null;const pool=files(pid).filter(f=>f.owner.toLowerCase()===person.id);
 const needle=person.artifact.replace(/^(Figma|GitHub) · /,'').toLowerCase();
 return pool.find(f=>f.title.toLowerCase()===needle)||pool.find(f=>needle&&f.title.toLowerCase().includes(needle))||pool.find(f=>f.stage===activeStage(model.projects[pid])&&f.icon===person.tool)||pool.find(f=>f.icon===person.tool)||pool[0];
}

tes. Action format: Name | Task | YYYY-MM-DD.</p>`:`<div class="note-editor-heading"><h2>Meeting recordings</h2><p class="small">Replay the audio, then review the written record.</p></div><div id="note-audio-list">${n.audioIds.length?n.audioIds.map(id=>{const f=model.files.find(x=>x.id===id);return `<div class="audio-file"><div class="between"><strong>${esc(f?.title||'Recording')}</strong>${btn('Download','download',`data-id="${id}"`,'small-btn')}</div><audio controls preload="metadata" data-note-audio="${id}" aria-label="${esc(f?.title||'Meeting recording')}"></audio><p class="small">${f?.duration?Math.floor(f.duration/60)+':'+String(Math.floor(f.duration%60)).padStart(2,'0')+' · ':''}${size(f?.size)} · Original audio</p></div>`}).join(''):`<div class="empty compact">${I('headphones')}<h3>No recording attached</h3><p>Record a meeting or upload an existing audio file.</p></div>`}</div>`}</section><aside class="note-side"><h3>Capture the meeting</h3><p>${n.mode==='online'?'Upload your call recording, or record your microphone.':'Record an in-person conversation with your microphone.'}</p>${can?`<button class="record-launch" data-action="record-start" data-id="${n.id}">${I('mic')} ${recordingSession?.noteId===n.id?'Recording in progress':'Start recording'}</button>${btn(I('upload')+' Upload audio','note-upload-audio','','full-width')}<input hidden type="file" id="note-audio-file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.mp4"><p class="field-note">Microphone audio only. ${typeof flowService!=='undefined'&&flowService.connected?'Recordings are saved in your shared workspace.':'Recordings stay in this browser.'} Online call audio is not captured automatically.</p>`:'<p class="small">The note owner or PM can add recordings.</p>'}<div class="detail-section"><h3>Connected to</h3><p class="small">${esc(model.projects[n.project].name)}<br>${esc(model.projects[n.project].workflow[n.stage]?.title)}</p>${event?btn(I('calendar')+' Open calendar event','cal-item',`data-kind="eve async function saveNoteNow(){clearTimeout(noteSaveTimer);const status=$('#note-save-status');if(status)status.textContent='Saving…';try{await save();if($('#note-save-status'))$('#note-save-status').textContent='Saved';}catch{if($('#note-save-status'))$('#note-save-status').textContent='Not saved · click Save to retry';}}
function transcriptDraft(text,n){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean),decisions=lines.filter(x=>/^(decision|agreed|决定|决策)\s*[:：]/i.test(x)).map(x=>x.replace(/^[^:：]+[:：]\s*/,'')),actions=[];for(const line of lines){const match=line.match(/^(?:action|todo|行动项|待办)\s*[:：]\s*([^|]+)\|\s*([^|]+)(?:\|\s*(\d{4}-\d{2}-\d{2}))?/i);if(!match)continue;const person=model.projects[n.project].people.find(x=>x.name.toLowerCase().includes(match[1].trim().toLowerCase()));actions.push({id:uid(),title:match[2].trim(),person:person?.id||n.owner,due:match[3]||'',taskId:null});}return {summary:lines.filter(x=>!/^(action|todo|行动项|待办|decision|agreed|决定|决策)\s*[:：]/i.test(x)).slice(0,4).join('\n'),decisions:decisions.join('\n'),actions};}
function draftMinutesDialog(){const n=model.meetingNotes.find(x=>x.id===ui.noteId);if(!n||!canEditNote(n))return;if(!n.transcript.trim()){ui.noteTab='transcript';render();toast('Add or import a transcript first.');return;}const d=transcriptDraft(n.transcript,n);modalData={noteDraft:d,noteId:n.id};showModal(`<p class="small">Review the summary, decisions, and actions before saving.</p><div class="detail-section"><h3>Summary</h3><p class="note-copy">${esc(d.summary||'No summary lines found.')}</p></div><div class="detail-section"><h3>Explicit decisions</h3><p class="note-copy">${esc(d.decisions||'No explicit decisions found. Add them manually.')}</p></div><div class="detail-section"><h3>Action items · ${d.actions.length}</h3>${d.actions.map(a=>`<p class="note-copy">${esc(memberName(a.person))}: ${esc(a.title)}</p>`).join('')||'<p class="small">Use “Action: Name | Task | YYYY-MM-DD” in the transcript, or add actions manually.</p>'}</div><p class="field-note">Existing minutes are preserved in version history before this draft is applied.</p>`,'Review draft minutes',esc(n.title),btn('Cancel','close')+btn('Apply draft','note-apply-draft','','primary'),false,true);}
async function applyMinutesDraft(){const n=model.meetingNotes.find(x=>x.id===modalData.noteId),d=modalData.noteDraft;if(!n||!canEditNote(n))return;if(await mutate(()=>{n.versions??=[];if(n.summary||n.decisions)n.versions.push({summary:n.summary,decisions:n.decisions,at:Date.now()});n.summary=d.summary;n.decisions=d.decisions;n.actions.push(...d.actions.filter(a=>!n.actions.some(x=>x.title===a.title&&x.person===a.person)));n.method='demo-draft';n.status='draft';n.updated=Date.now();},'Draft applied for review')){close();ui.noteTab='minutes';render();}}
async function saveRecording(blob,noteId,filename,duration=0){const n=model.meetingNotes.find(x=>x.id===noteId);if(!n)throw Error('Missing meeting note');const backup=structuredClone(model),id=uid();try{model.files.unshift({id,title:filename,filename,project:n.project,stage:n.stage,noteId,owner:myName(),ownerId:me(),kind:'uploaded',icon:'upload',tool:'Meeting recording',mime:blob.type||'audio/webm',size:blob.size,duration,added:Date.now(),versions:[{label:'Original recording',by:myName()}]});n.audioIds.push(id);n.updated=Date.now();await save([{id,blob}]);return id;}catch(e){model=backup;throw e;}}
async function uploadNoteAudio(file){const n=model.meetingNotes.find(x=>x.id===ui.noteId);if(!file||!n||!canEditNote(n))return;if(file.size>100*1024*1024||!(/^(audio\/|video\/mp4)/.test(file.type)||/\.(mp3|m4a|wav|webm|ogg|mp4)$/i.test(file.name))){toast('Choose an audio recording smaller than 100 MB.');return;}try{await saveRecording(file,n.id,file.name);ui.noteTab='recording';render();toast('Recording attached. Add a transcript to draft minutes.');}catch{toast('Could not save the recording. Check browser storage and try again.');}}
function elapsedRecording(s){return Math.max(0,((s.pausedAt||Date.now())-s.startedAt-s.pausedTotal)/1000)}
function recordingBanner(){const root=$('#recorder-banner');if(!root)return;if(unsavedRecording){root.innerHTML=`<div class="recording-banner"><span>Recording retained · save failed</span>${btn('Retry save','record-retry','','small-btn')}${btn('Download audio','record-download','','small-btn')}</div>`;return;}if(!recordingSession){root.innerHTML='';return;}const s=recordingSession,secs=Math.floor(elapsedRecording(s));root.innerHTML=`<div class="recording-banner"><span class="record-dot ${s.pausedAt?'paused':''}"></span><button data-action="note-open" data-id="${s.noteId}">${s.pausedAt?'Paused':'Recording'} · ${esc(model.meetingNotes.find(n=>n.id===s.noteId)?.title||'Meeting')}</button><time>${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}</time>${btn(I(s.pausedAt?'mic':'pause')+(s.pausedAt?' Resume':' Pause'),'record-pause','','small-btn')}${btn(I('stop')+' Stop & save','record-stop','','small-btn')}</div>`;}
async function startRecording(noteId){if(recordingSession){toast('A recording is already running. Use the recording bar to pause or stop.');return;}if(unsavedRecording){toast('Save or download the retained recording first.');return;}if(recordingRequest)return;const n=model.meetingNotes.find(x=>x.id===noteId);if(!n||!canEditNote(n))return;if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('Microphone recording is unavailable here. You can upload an audio file.');return;}recordingRequest=true;let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x)),recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:{}),session={noteId,stream,recorder,chunks:[],startedAt:Date.now(),pausedAt:0,pausedTotal:0,timer:null};recordingSession=session;recorder.ondataavailable=e=>{if(e.data?.size)session.chunks.push(e.data)};recorder.onerror=()=>{toast('Recording was interrupted. Available audio will be saved.');if(recorder.state!=='inactive')recorder.stop();};recorder.onstop=async()=>{clearInterval(session.timer);session.stream.getTracks().forEach(x=>x.stop());const blob=new Blob(session.chunks,{type:recorder.mimeType||'audio/webm'}),duration=elapsedRecording(session),filename=n.title.replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,70)+' · '+n.date+(blob.type.includes('mp4')?'.m4a':blob.type.includes('ogg')?'.ogg':'.webm');recordingSession=null;if(!blob.size){recordingBanner();toast('No audio was captured. Try again or upload a recording.');return;}try{await saveRecording(blob,noteId,filename,duration);openNote(noteId);ui.noteTab='recording';render();toast('Recording saved');}catch{unsavedRecording={blob,noteId,filename,duration};toast('Audio is retained. Retry saving or download it.');}recordingBanner();};recorder.start(1000);session.timer=setInterval(recordingBanner,1000);recordingBanner();render();}catch(e){stream?.getTracks().forEach(x=>x.stop());recordingSession=null;toast(e.name==='NotAllowedError'?'Microphone access was not granted. Allow it in the browser or upload an audio file.':'Could not start the microphone. Check the device or upload an audio file.');}finally{recordingRequest=false;}}
async function afterCollaborationRender(){if(ui.page==='chat'){const area=$('#chat-messages');if(area)area.scrollTop=area.scrollHeight;}if(ui.page==='calendar'&&ui.calendarView==='week'){$('.week-calendar')?.scrollTo({top:0});const body=$('.week-timebody');if(body)body.parentElement.parentElement.scrollTop=360;}if(ui.page==='notes'&&ui.noteId){const id=ui.noteId;for(const audio of document.querySelectorAll('[data-note-audio]')){try{const blob=await getBlob(audio.dataset.noteAudio);if(blob&&ui.noteId===id&&audio.isConnected){const u=URL.createObjectURL(blob);noteAudioURLs.push(u);audio.src=u;}}catch{}}}recordingBanner();}

function validWorkURL(raw){const url=new URL(raw);if(!['https:','http:'].includes(url.protocol))throw Error('Use an https:// or http:// link.');return url.href;}
async function appendRevision(fileId,{file=null,url='',type='snapshot',note='',replace=false},returnTask=null){
 const f=model.files.find(f=>f.id===fileId);if(!f||!canEditFile(f))throw Error('Only the work owner or a project PM can add versions.');
 if(type==='snapshot'&&!file)throw Error('Choose a file to upload.');
 if(file&&(file.size>25*1024*1024||!/\.(pdf|png|jpe?g|webp|gif|txt|md|docx?|xlsx?|csv|pptx?|zip|wav|mp3|m4a|webm|ogg)$/i.test(file.name)))throw Error('Choose a supported file up to 25 MB.');
 if(type!=='snapshot')url=validWorkURL(url);
 const backup=structuredClone(model),prev=currentRevision(f),isReplace=replace&&prev.type==='sample'&&!prev.url&&!prev.blobId;
 const v={id:isReplace?prev.id:uid(),number:isReplace?prev.number:Math.max(...f.revisions.map(v=>v.number||0))+1,type,url,blobId:file?uid():null,filename:file?.name||'',size:file?.size||0,mime:file?.type||'',at:Date.now(),by:me(),stageId:model.projects[f.project].workflow[f.stage].id,note,reviewers:[]};
 try{if(isReplace)f.revisions[0]=v;else f.revisions.unshift(v);Object.assign(f,{sample:false,kind:file?'uploaded':'linked',url:url||'',filename:v.filename,size:v.size,mime:v.mime,added:v.at,icon:file?'upload':detectTool(url),tool:file?'Uploaded file':toolName(detectTool(url))});
  activity(displayTitle(f)+' · '+versionLabel(v),isReplace?'Source attached by '+myName():'New version shared by '+myName(),f.project,f.stage);
  notifyMembers([fileOwner(f),...OrbitFlow.assignees(taskFor(f)),...feedbackFor(f).map(c=>c.author)],'version',displayTitle(f)+' has a new version',{project:f.project,fileId:f.id,revisionId:v.id});
  await save(file?[{id:v.blobId,blob:file}]:[]);return v;
 }catch(e){model=backup;throw e;}
}

async function flowAI(mode,source,extra={}){if(!flowService.ai)throw Error('AI is not connected yet. You can still add stages, tasks, and suggested changes manually.');const response=await fetch(orbitAPI('/api/ai'),{method:'POST',headers:{'Content-Type':'application/json','X-Orbit-CSRF':flowService.csrf},body:JSON.stringify({mode,source,project:mode==='dm_summary'?undefined:mode==='plan'?(flowPlan.fresh?undefined:flowPlan.project):(source?.project||ui.project),brief:mode==='plan'?flowPlan.brief:undefined,...extra})});const result=await response.json();if(flowService.demo&&!result.demo){try{result.demo=await orbitRequest('/api/demo');}catch{}}if(result.demo){flowService.demo=result.demo;if(typeof renderDemoAllowance==='function')renderDemoAllowance();}if(!response.ok)throw Error(result.error||'AI could not complete this request. Try again.');return result;}
async function flowReviewAI(source,purpose){if(!purpose&&source?.kind==='chat')return chatReviewSource(source);if(!source?.text.trim())return flowError('Add a transcript or meeting notes first.');const button=$('[data-action="flow-source-ai"]');if(button){button.disabled=true;button.textContent='Reviewing…';}try{const result=await flowAI('changes',source,{purpose});if(!result)return;const saved=await mutate(()=>{if(model.sources.some(s=>s.id===source.id)&&result.summary!==source.summary)source={...source,id:uid(),summary:result.summary};else source.summary=result.summary||source.summary;flowStoreSource(source);for(const candidate of result.proposals||[]){const t=flowTask(candidate.taskId);const signature=JSON.stringify([source.id,candidate.kind,candidate.taskId,candidate.patch]);if(model.proposals.some(q=>q.signature===signature))continue;model.proposals.unshift({...candidate,id:uid(),sourceId:source.id,project:source.project,status:'pending',origin:'ai',model:result.model,author:me(),created:Date.now(),before:t?Object.fromEntries(Object.keys(candidate.patch||{}).map(k=>[k,t[k]??null])):{},signature});}},'Conversation reviewed');if(saved)flowSourceDialog(source.id);}catch(e){flowError(e.message);}finally{if(button){button.disabled=false;button.textContent='Review with AI';}}}

  const plannedStart=timelineValidDate(task.plannedStart),plannedEnd=timelineValidDate(task.plannedEnd),start=timelineValidDate(task.startDate),due=timelineValidDate(taskDate(task.due)),prediction=forecast.rows[task.id];

 if(d.id&&JSON.stringify(pr.channels.find(c=>c.id===d.id))!==d.base)return fail('This channel changed. Reopen its details before saving.');

}

let personWorkCard=null,personWorkOpenTimer=null,personWorkCloseTimer=null,personWorkPending=null;
function personWorkClearTimers(){clearTimeout(personWorkOpenTimer);clearTimeout(personWorkCloseTimer);personWorkPending=null;}
function personWorkClose(returnFocus=false){

function personWorkAnchor(target){

 if(!avatar||avatar.closest('#person-work-card, label, [role="option"], [data-action="account-menu"]')||avatar.closest('button:disabled'))return null;
 const id=avatar.dataset.personTrigger||avatar.dataset.personAvatar;if(id===me())return null;

}
function personWorkPosition(){
 const state=personWorkCard;if(!state)return;
 if(!state.anchor.isConnected||state.viewer!==me()){personWorkClose();return;}
 const r=state.anchor.getBoundingClientRect(),card=state.card;
 const vw=document.documentElement.clientWidth,vh=window.innerHeight;
 card.style.maxHeight=Math.max(80,vh-24)+'px';
 const width=card.offsetWidth,height=card.offsetHeight,gap=10;
 let left=r.right+gap;if(left+width>vw-12)left=r.left-width-gap;
 if(left<12)left=Math.max(12,Math.min(r.left,vw-width-12));
 card.style.left=left+'px';card.style.top=Math.max(12,Math.min(r.top-12,vh-height-12))+'px';
}
function personWorkOpen(anchor,pinned=false){
 personWorkClearTimers();const id=anchor.dataset.personTrigger||anchor.dataset.personAvatar,data=personSharedWork(id);
 if(!anchor.isConnected||!data)return;
 if(personWorkCard?.anchor===anchor){if(pinned){personWorkCard.pinned=true;personWorkCard.card.querySelector('[data-person-close]').focus();}return;}
 personWorkClose();const card=document.createElement('section');card.id='person-work-card';card.className='person-work-card';card.setAttribute('popover','manual');card.setAttribute('role','dialog');card.setAttribute('aria-labelledby','person-work-title');card.innerHTML=personWorkMarkup(data);

function personWorkSchedule(anchor){

 if(personWorkCard?.pinned||personWorkCard?.anchor===anchor||personWorkPending===anchor)return;

function personWorkLeave(){

document.addEventListener('focusout',e=>{

let aiPlanBusy=false,aiPlanUndo=null;

 if(!draft?.brief)return flowError(draft?.fresh?'Add the project brief first.':'Describe what you want to change in the plan.');
 const before=JSON.stringify(draft);aiPlanBusy=true;const b=$('[data-action="flow-ai-plan"]');if(b){b.disabled=true;b.textContent='Drafting…';}
 try{
  const result=await flowAI(draft.fresh?'plan':'plan_update',null,draft.fresh?{}:{project:draft.project,brief:draft.brief,plan:aiPlanSnapshot(draft)});
  flowReadPlan();if(flowPlan!==draft||JSON.stringify(draft)!==before){toast('Your plan changed while AI was drafting. Try again with the latest version.');return;}

  if(draft.fresh){const ids=result.tasks.map(()=>uid());Object.assign(draft,{stages:result.stages.map(s=>({...newStage(),...s})),tasks:result.tasks.map((t,i)=>({...t,id:ids[i],project:draft.project,blockedBy:t.dependsOn.map(n=>ids[n]),person:t.person||'',assigneeIds:t.person?[t.person]:[],status:'Not started',done:false,priority:'none',planOrder:i,history:[],watchers:[]})),aiDraft:true});}

};

   const track=stream.getTracks()[0];c.stream.addTrack(track);track.onended=()=>{c.stream.removeTrack(track);callLocalUI(c);if(c.joined)callSendMedia(c).catch(()=>{});};

 const other=people.filter(p=>p.id!==c.participant);
 for(const person of other){let peer=c.peers.get(person.id);if(!peer){const grid=c.root.querySelector('.call-grid');grid.insertAdjacentHTML('beforeend',callTile(person.id,person.name));const tile=grid.lastElementChild,pc=new RTCPeerConnection({iceServers:c.iceServers}),stream=new MediaStream();peer={pc,tile,stream,candidates:[],senders:{},offered:false};c.peers.set(person.id,peer);
  if(c.participant<person.id)for(const kind of ['audio','video']){const tx=pc.addTransceiver(kind,{direction:'sendrecv',streams:[c.stream]});peer.senders[kind]=tx.sender;const track=c.stream.getTracks().find(t=>t.kind===kind);if(track)tx.sender.replaceTrack(track).catch(()=>{});}
  tile.querySelector('video').srcObject=stream;
  pc.ontrack=e=>{if(!stream.getTracks().includes(e.track))stream.addTrack(e.track);const v=tile.querySelector('video');v.play().catch(()=>{callMessage('Click Enable sound to hear the meeting.');if(!c.root.querySelector('[data-action="orbit-call-audio"]'))c.root.querySelector('.call-devices').insertAdjacentHTML('beforeend',btn('Enable sound','orbit-call-audio'));});};
  pc.onicecandidate=e=>{if(e.candidate&&orbitCall===c)callRequest(c,'signal',{to:person.id,signal:{candidate:e.candidate.toJSON()}}).catch(()=>{});};
  pc.onconnectionstatechange=()=>{if(orbitCall!==c)return;tile.dataset.connection=pc.connectionState;if(pc.connectionState==='failed'){tile.querySelector('.call-media-status').textContent='Connection failed';callMessage('A connection could not be established. Try rejoining; this network may need a meeting relay.');}else callUpdateStatus(c);};
 }
 peer.tile.classList.toggle('has-video',person.camera);peer.tile.querySelector('.call-media-status').textContent=person.mic?'Microphone on':'Microphone off';
 }
 callUpdateStatus(c);
}
function callUpdateStatus(c){const count=[...c.peers.values()].filter(p=>p.pc.connectionState==='connected').length;callMessage(count?`${count+1} participants connected` : c.peers.size?'Connecting to your teammates…':'You’re here. Waiting for teammates to join.');}
async function callProcessSignal(c,message){
 const peer=c.peers.get(message.from);if(!peer)return;const pc=peer.pc;
 if(message.description){if(message.description.type==='answer'&&pc.signalingState!=='have-local-offer')return;await pc.setRemoteDescription(message.description);for(const candidate of peer.candidates)await pc.addIceCandidate(candidate);peer.candidates=[];if(message.description.type==='offer'){for(const tx of pc.getTransceivers()){const kind=tx.receiver.track.kind;tx.direction='sendrecv';peer.senders[kind]=tx.sender;await tx.sender.replaceTrack(c.stream.getTracks().find(t=>t.kind===kind)||null);}await pc.setLocalDescription(await pc.createAnswer());await callRequest(c,'signal',{to:message.from,signal:{description:pc.localDescription.toJSON()}});}}
 else if(message.candidate){if(pc.remoteDescription)await pc.addIceCandidate(message.candidate);else peer.candidates.push(message.candidate);}
}
async function callPoll(c){
 if(orbitCall!==c||!c.joined)return;
 try{
  const result=await callRequest(c,'poll',{after:c.cursor});if(orbitCall!==c)return;callSyncRoster(c,result.participants);
  for(const message of result.messages){await callProcessSignal(c,message);c.cursor=message.seq;}
  for(const [id,peer] of c.peers)if(c.participant<id&&!peer.offered){if(peer.pc.signalingState==='stable')await peer.pc.setLocalDescription(await peer.pc.createOffer());await callRequest(c,'signal',{to:id,signal:{description:peer.pc.localDescription.toJSON()}});peer.offered=true;}
  c.failures=0;
 }catch(e){if(orbitCall!==c)return;if([401,403,410].includes(e.status)||++c.failures>=5){leaveOrbitCall(e.message);return;}callMessage('Reconnecting to the meeting…');}
 if(orbitCall===c)c.timer=setTimeout(()=>callPoll(c),1200);
}
function closeOrbitCallEnded(){const c=orbitCallEnded;if(!c)return;orbitCallEnded=null;c.root.remove();$('#app').inert=false;c.lastFocus?.isConnected&&c.lastFocus.focus();}
function showOrbitCallEnded(c){
 const note=model.meetingNotes.find(n=>n.eventId===c.event.id),others=c.roster.some(p=>p.id!==c.participant);
 orbitCallEnded=c;
 c.root.innerHTML=`<section class="orbit-call call-ended" role="dialog" aria-modal="true" aria-labelledby="call-ended-title"><header><div><span class="settings-eyebrow">MEETING WRAP-UP</span><h2>${esc(c.event.title)}</h2><p>${esc(model.projects[c.event.project]?.name||'')}</p></div>${btn(I('x'),'orbit-call-ended-close','aria-label="Close meeting wrap-up"','icon-btn')}</header><main class="call-ended-main"><div class="call-ended-mark">${I('check')}</div><h1 id="call-ended-title">${others?'You left the meeting.':'Meeting ended.'}</h1><p class="call-ended-intro">Keep the conversation moving.</p><section class="call-ended-notes" aria-labelledby="call-ended-notes-title"><div class="call-ended-note-icon">${I('note')}</div><div><span class="settings-eyebrow">THIS MEETING’S NOTES</span><h2 id="call-ended-notes-title">${esc(c.event.title)}</h2><p>${note?'Review the notes, then use AI to find decisions and next steps.':'Start with your notes or a transcript, then review with AI.'}</p></div>${note?`<span class="pill ${note.status==='reviewed'?'green':''}">${note.status==='reviewed'?'Reviewed':'Draft'}</span>`:''}</section><div class="call-ended-actions">${btn(I('note')+(note?' View meeting notes':' Create meeting notes'),'orbit-call-ended-notes','','primary')}${canJoinOrbitMeeting(c.event)?btn('Rejoin meeting','orbit-call-ended-rejoin','','quiet'):''}</div><p class="call-ended-footnote">You review and confirm any AI-suggested changes.</p></main></section>`;
 $('#app').inert=true;c.root.focus();
}
function leaveOrbitCall(message){const c=orbitCall;if(!c)return;orbitCall=null;clearTimeout(c.timer);for(const peer of c.peers.values())peer.pc.close();c.stream.getTracks().forEach(t=>t.stop());if(c.participant)callRequest(c,'leave').catch(()=>{});if(c.joined&&!message){showOrbitCallEnded(c);return;}c.root.remove();$('#app').inert=false;c.lastFocus?.isConnected&&c.lastFocus.focus();if(message)toast(message);}
const callRender=render;
render=function(){callRender();if(orbitCall||orbitCallEnded)$('#app').inert=true;const match=location.hash.match(/^#call=([\w-]+)$/);if(match&&callDeepLinkHandled!==match[1]&&model){callDeepLinkHandled=match[1];setTimeout(()=>openOrbitCall(match[1]),0);}};
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#call=')){callDeepLinkHandled='';render();}});
window.addEventListener('pagehide',()=>{const c=orbitCall;if(!c)return;c.stream.getTracks().forEach(t=>t.stop());if(c.participant)fetch(orbitAPI('/api/calls/'+c.event.id),{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Orbit-CSRF':flowService.csrf},body:JSON.stringify({action:'leave',participant:c.participant})}).catch(()=>{});});
document.addEventListener('keydown',e=>{const c=orbitCall||orbitCallEnded;if(!c)return;if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();orbitCall?leaveOrbitCall():closeOrbitCallEnded();}if(e.key==='Tab'){const nodes=[...c.root.querySelectorAll('button:not(:disabled),a[href]')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===c.root)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}},true);
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]'),a=b?.dataset.action;if(!a?.startsWith('orbit-call-'))return;e.preventDefault();
 if(a==='orbit-call-open')openOrbitCall(b.dataset.id);
 if(a==='orbit-call-mic'||a==='orbit-call-camera')await toggleCallMedia(a==='orbit-call-mic'?'audio':'video');
 if(a==='orbit-call-join')await joinOrbitCall();
 if(a==='orbit-call-leave')leaveOrbitCall();
 if(a==='orbit-call-ended-close')closeOrbitCallEnded();
 if(a==='orbit-call-ended-rejoin'){const id=orbitCallEnded?.event.id;closeOrbitCallEnded();if(id)openOrbitCall(id);}
 if(a==='orbit-call-ended-notes'){const id=orbitCallEnded?.event.id;if(id){const note=model.meetingNotes.find(n=>n.eventId===id);closeOrbitCallEnded();if(note){openNote(note.id);if(note.transcript?.trim()&&!note.summary?.trim()){ui.noteTab='transcript';render();}}else newNoteDialog(id);}}
 if(a==='orbit-call-audio'){for(const v of orbitCall?.root.querySelectorAll('video')||[])v.play().catch(()=>{});b.remove();}
 if(a==='orbit-call-copy'){const event=model.events.find(e=>e.id===b.dataset.id);try{await navigator.clipboard.writeText(orbitMeetingLink(event));toast('Room link copied. Invited teammates sign in to join.');}catch{toast('Could not copy the link. Please allow clipboard access.');}}
});

// A self-contained, disposable playback of the product's own interface.
// No API, account, browser storage, or user workspace is used.
// Presentation replay must never move focus or scroll the surrounding case study.
HTMLElement.prototype.focus=function(){};
const showcaseScene = new URLSearchParams(location.search).get('scene') || 'plan';
const showcaseMobile = showcaseScene === 'mobile';
const showcaseCursor = document.createElement('div');
showcaseCursor.id='showcase-cursor';
showcaseCursor.innerHTML='<svg viewBox="0 0 24 28"><path d="M3 2v21l6-5 4 8 4-2-4-7 8-1Z" fill="#272832" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg><i></i>';
document.body.append(showcaseCursor);
let showcaseSeeking=false;
let showcaseRunning=false,showcaseTime=0,showcaseLast=0,showcaseNext=0,showcaseRaf=0,showcasePending=[];
const showcaseSend=(data)=>parent.postMessage({type:'orbit-showcase',scene:showcaseScene,...data},'*');
const showcaseNav=(page)=>{close();ui.page=page;ui.menu=false;render();};
const showcaseTask=(title)=>[...document.querySelectorAll('[data-action="task-edit"]')].find(el=>el.textContent.includes(title));
const showcaseClick=(element)=>{
 if(!element)return;
 if(showcaseSeeking){element.click();return;}
 const scroller=element.closest('.dialog-body,.main-scroll,.side-scroll');
 if(scroller){const r=element.getBoundingClientRect(),box=scroller.getBoundingClientRect();if(r.bottom>box.bottom||r.top<box.top)scroller.scrollTop+=r.top-box.top-Math.min(box.height/3,160);}
 const rect=element.getBoundingClientRect();
 showcaseCursor.style.opacity='1';
 showcaseCursor.style.transform=`translate(${rect.x+Math.min(rect.width*.55,140)}px,${rect.y+rect.height*.5}px)`;
 showcasePending.push({at:showcaseTime+.48,run:()=>{showcaseCursor.classList.remove('tap');void showcaseCursor.offsetWidth;showcaseCursor.classList.add('tap');element.click();}});
};
const showcaseSelector=(s)=>showcaseClick(document.querySelector(s));
const showcaseScenes={
 plan:{duration:21,initial:'stages',cues:[
  {at:0,step:0,run:()=>{}},
  {at:3,step:1,run:()=>showcaseSelector('[data-action="stage-view"][data-view="board"]')},
  {at:7,step:2,run:()=>showcaseSelector('[data-action="stage-view"][data-view="timeline"]')},
  {at:12,step:0,run:()=>showcaseSelector('[data-action="stage-view"][data-view="list"]')},
  {at:15,step:3,run:()=>showcaseClick(showcaseTask('Hi-fi onboarding flow'))}
 ]},
 people:{duration:23,initial:'people',cues:[
  {at:0,step:0,run:()=>{}},
  {at:3,step:1,run:()=>showcaseSelector('[data-action="person"][data-id="nina"]')},
  {at:7,step:2,run:()=>showcaseClick(showcaseTask('Final onboarding copy'))},
  {at:13,step:0,run:()=>{close();}},
  {at:15,step:1,run:()=>showcaseSelector('[data-action="person"][data-id="alex"]')},
  {at:18,step:2,run:()=>showcaseClick(showcaseTask('Hi-fi onboarding flow'))}
 ]},
 mobile:{duration:22,initial:'overview',cues:[
  {at:0,step:0,run:()=>{}},
  {at:3,step:1,run:()=>showcaseClick(showcaseTask('Final onboarding copy'))},
  {at:8,step:1,run:()=>{const body=document.querySelector('.dialog-body');if(body)body.scrollTo({top:250,behavior:'smooth'});}},
  {at:11,step:2,run:()=>{showcaseNav('chat');}},
  {at:16,step:3,run:()=>{showcaseNav('files');}}
 ]}
};
const showcaseConfig=showcaseScenes[showcaseScene]||showcaseScenes.plan;
function showcaseReset(){
 showcasePending=[];showcaseNext=0;showcaseTime=0;
 close();
 model=initialModel();ui.viewer='maya';ui.role='pm';ui.project='onboarding';ui.page=showcaseConfig.initial;ui.stage=2;ui.stageView='list';ui.overviewStage=null;
 migrateWorkflow();migrateCollaboration();migrateTeamspace();migratePMScenario();migratePreviewJointAssignment();migratePreviewFileHistory();flowMigrate();
 if(showcaseMobile){const updated=model.tasks.find(task=>task.title==='Final onboarding copy'&&task.project==='onboarding');if(updated)updated.due='2026-10-09';}
 ui.collapsedStages=p().workflow.filter((_,i)=>i!==2).map(s=>s.id);
 save=async()=>{};db={showcase:true};
 flowService={connected:false,ai:false};
 render();
 const label=document.querySelector('.workspace .small');if(label)label.textContent='Demo workspace';
 showcaseCursor.style.opacity='0';showcaseCursor.style.transform='translate(850px,560px)';
 showcaseSend({step:0});
}
function showcaseFrame(now){
 if(!showcaseRunning)return;
 showcaseTime+=Math.min((now-showcaseLast)/1000,.1);showcaseLast=now;
 if(showcaseTime>=showcaseConfig.duration)showcaseReset();
 while(showcaseNext<showcaseConfig.cues.length&&showcaseTime>=showcaseConfig.cues[showcaseNext].at){const cue=showcaseConfig.cues[showcaseNext++];cue.run();showcaseSend({step:cue.step});}
 showcasePending=showcasePending.filter(job=>{if(showcaseTime>=job.at){job.run();return false;}return true;});
 showcaseRaf=requestAnimationFrame(showcaseFrame);
}
function showcasePlay(){if(showcaseRunning)return;showcaseRunning=true;showcaseLast=performance.now();showcaseRaf=requestAnimationFrame(showcaseFrame);}
function showcasePause(){showcaseRunning=false;cancelAnimationFrame(showcaseRaf);}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='orbit-showcase-control')return;
 if(event.data.action==='play')showcasePlay();
 if(event.data.action==='pause')showcasePause();
 if(event.data.action==='restart'){showcaseReset();showcasePlay();}
 if(event.data.action==='step'&&Number.isInteger(event.data.step)){
  const index=showcaseConfig.cues.findIndex(cue=>cue.step===event.data.step);
  if(index<0)return;
  showcasePause();showcaseReset();showcaseSeeking=true;
  for(let i=0;i<=index;i++)showcaseConfig.cues[i].run();
  showcaseSeeking=false;showcaseNext=index+1;showcaseTime=showcaseConfig.cues[index].at+.65;
  showcaseSend({step:event.data.step});showcasePlay();
 }
});
showcaseReset();showcaseSend({ready:true});
